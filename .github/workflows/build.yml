# Testa e gera Meerkat.exe (Windows) e Meerkat.dmg (macOS). Tag "v*" publica uma Release com os dois.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MEERKAT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest Pillow keyring certifi
      - run: python -m pytest -q --ignore=tests/test_autostart.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -c "import app"
      - run: pyinstaller --noconfirm --clean meerkat.spec
      - uses: actions/upload-artifact@v7
        with:
          name: Meerkat-windows
          path: dist/Meerkat.exe
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: ./build_mac.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Meerkat-macos
          path: dist/Meerkat.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Meerkat.exe
            dist/Meerkat.dmg
          generate_release_notes: true
          body: |
            ## Download
            - **Windows:** `Meerkat.exe` — SmartScreen may warn the first time: *More info → Run anyway*.
            - **macOS 13+:** `Meerkat.dmg` — drag to Applications; the first time, right-click → *Open*.

            Uses your GitHub CLI login (`gh auth login`) or a personal access token set in Settings.
